riciclo consapevole come ultima risorsa?","options":["Una gerarchia di priorità per una gestione responsabile dei dispositivi elettronici","Un tipo di protocollo di rete","Un componente hardware","Un formato di compressione"],"correct":"A","explain":"A) Una gerarchia di priorità per una gestione responsabile dei dispositivi elettronici."},{"n":228,"chapter":11,"chapter_title":"Economia circolare ed etica del digitale","section":"Livello Intermedio","type":"mc","stem":"A cosa serve, per un'organizzazione come una scuola o un centro anziani, un progetto di raccolta di hardware donato e rigenerato?","options":["A offrire accesso a strumenti informatici funzionanti a chi altrimenti non potrebbe permetterseli, riducendo anche gli sprechi","A vietare l'uso dei computer","A rallentare deliberatamente le macchine","A aumentare il costo dei dispositivi"],"correct":"A","explain":"A) A offrire accesso a strumenti informatici funzionanti a chi altrimenti non potrebbe permetterseli."},{"n":229,"chapter":11,"chapter_title":"Economia circolare ed etica del digitale","section":"Livello Intermedio","type":"vf","stem":"Vero o Falso: la sostenibilità ambientale, in ambito informatico, riguarda anche il consumo energetico dei dispositivi durante l'uso quotidiano.","options":[],"correct":"Vero","explain":"Vero — la sostenibilità informatica riguarda anche il consumo energetico durante l'uso quotidiano."},{"n":230,"chapter":11,"chapter_title":"Economia circolare ed etica del digitale","section":"Livello Intermedio","type":"mc","stem":"Che cosa si intende per \"software leggero\", pensato per hardware datato?","options":["Un software progettato per funzionare correttamente anche con risorse hardware limitate, come poca RAM o processori meno recenti","Un software che occupa più spazio possibile","Un software che richiede sempre hardware nuovissimo","Un tipo di virus"],"correct":"A","explain":"A) Un software progettato per funzionare correttamente anche con risorse hardware limitate."},{"n":231,"chapter":11,"chapter_title":"Economia circolare ed etica del digitale","section":"Livello Intermedio","type":"mc","stem":"A cosa serve, in termini etici, riflettere sull'accessibilità economica degli strumenti digitali?","options":["A considerare come includere anche chi ha minori possibilità economiche nell'uso consapevole della tecnologia","A escludere automaticamente chi non può spendere molto","A vietare l'uso di dispositivi datati","A rendere la tecnologia disponibile solo a pagamento"],"correct":"A","explain":"A) A considerare come includere anche chi ha minori possibilità economiche nell'uso della tecnologia."},{"n":232,"chapter":11,"chapter_title":"Economia circolare ed etica del digitale","section":"Livello Intermedio","type":"vf","stem":"Vero o Falso: la scelta di un sistema operativo gratuito e libero, come FeniceOS, può contribuire a ridurre le barriere economiche all'accesso alla tecnologia.","options":[],"correct":"Vero","explain":"Vero — un sistema gratuito e libero come FeniceOS può ridurre le barriere economiche di accesso."},{"n":233,"chapter":11,"chapter_title":"Economia circolare ed etica del digitale","section":"Livello Esperto","type":"mc","stem":"Che cosa si intende, in etica del digitale, per \"esclusione digitale\"?","options":["La condizione di chi, per ragioni economiche, tecniche, culturali o di età, ha un accesso limitato o nullo agli strumenti e alle competenze digitali","Un tipo di virus informatico","Un componente hardware","Un protocollo di rete"],"correct":"A","explain":"A) La condizione di chi ha un accesso limitato o nullo agli strumenti e alle competenze digitali."},{"n":234,"chapter":11,"chapter_title":"Economia circolare ed etica del digitale","section":"Livello Esperto","type":"vf","stem":"Vero o Falso: l'esclusione digitale riguarda esclusivamente le persone anziane, e non altre categorie di popolazione.","options":[],"correct":"Falso","explain":"Falso — riguarda anche altre categorie, non solo le persone anziane."},{"n":235,"chapter":11,"chapter_title":"Economia circolare ed etica del digitale","section":"Livello Esperto","type":"mc","stem":"Che cosa indica, in ambito sostenibilità digitale, il concetto di \"impronta di carbonio\" legato all'uso della tecnologia?","options":["Una stima delle emissioni di gas serra associate alla produzione, all'uso e allo smaltimento dei dispositivi e dei servizi digitali","Un tipo di connessione internet","Un componente hardware","Un formato di file"],"correct":"A","explain":"A) Una stima delle emissioni di gas serra associate a produzione, uso e smaltimento della tecnologia."},{"n":236,"chapter":11,"chapter_title":"Economia circolare ed etica del digitale","section":"Livello Esperto","type":"mc","stem":"A cosa serve, secondo i principi di Tecnologia Gentile richiamati in questo manuale, distinguere tra un dispositivo \"vecchio\" e uno \"rotto\"?","options":["A evitare di scartare inutilmente hardware ancora perfettamente funzionante, semplicemente perché non più recentissimo","A giustificare sempre la sostituzione immediata","A vietare qualsiasi riparazione","A ridurre la vita utile dei dispositivi"],"correct":"A","explain":"A) A evitare di scartare inutilmente hardware ancora funzionante solo perché non recentissimo."},{"n":237,"chapter":11,"chapter_title":"Economia circolare ed etica del digitale","section":"Livello Esperto","type":"vf","stem":"Vero o Falso: contribuire a un progetto open source, per esempio segnalando problemi, proponendo miglioramenti o curando la documentazione, è una delle modalità con cui chiunque può contribuire, anche senza saper programmare.","options":[],"correct":"Vero","explain":"Vero — si può contribuire a un progetto open source anche senza scrivere codice."},{"n":238,"chapter":11,"chapter_title":"Economia circolare ed etica del digitale","section":"Livello Esperto","type":"mc","stem":"Che cosa si intende per \"trasparenza\" come principio etico applicato al software?","options":["La possibilità di verificare, quando il codice è aperto, come un programma funziona realmente","Un tipo di connessione Wi-Fi","Un componente hardware","Un formato di immagine"],"correct":"A","explain":"A) La possibilità di verificare, quando il codice è aperto, come un programma funziona realmente."},{"n":239,"chapter":11,"chapter_title":"Economia circolare ed etica del digitale","section":"Livello Esperto","type":"mc","stem":"A cosa serve, secondo questo manuale, promuovere la formazione digitale nei centri anziani, nelle scuole e nei centri sociali?","options":["A ridurre le barriere di accesso e competenza, favorendo una cittadinanza digitale più ampia e consapevole","A vietare l'uso della tecnologia agli anziani","A limitare l'accesso alla sola scuola","A rendere la tecnologia più costosa"],"correct":"A","explain":"A) A ridurre le barriere di accesso e competenza, favorendo una cittadinanza digitale più ampia."},{"n":240,"chapter":11,"chapter_title":"Economia circolare ed etica del digitale","section":"Livello Esperto","type":"vf","stem":"Vero o Falso: economia circolare, etica del digitale e contrasto all'obsolescenza programmata sono, secondo l'impostazione di questo manuale, principi tra loro collegati e complementari.","options":[],"correct":"Vero","explain":"<p>Vero — economia circolare, etica del digitale e contrasto all'obsolescenza sono principi collegati e complementari.</p>\n<h2>Risposte — Capitolo 12. FeniceOS e il mondo Linux: uso consapevole</h2>"},{"n":241,"chapter":12,"chapter_title":"FeniceOS e il mondo Linux: uso consapevole","section":"Livello Base","type":"mc","stem":"Su quale distribuzione Linux è basato FeniceOS?","options":["Ubuntu","Debian","Fedora","Arch Linux"],"correct":"B","explain":"B) Debian — la distribuzione Linux alla base di FeniceOS."},{"n":242,"chapter":12,"chapter_title":"FeniceOS e il mondo Linux: uso consapevole","section":"Livello Base","type":"vf","stem":"Vero o Falso: FeniceOS è pensato per funzionare anche su computer con risorse hardware limitate.","options":[],"correct":"Vero","explain":"Vero — FeniceOS è pensato per funzionare anche su hardware limitato."},{"n":243,"chapter":12,"chapter_title":"FeniceOS e il mondo Linux: uso consapevole","section":"Livello Base","type":"mc","stem":"Che cosa significa che FeniceOS è un sistema \"live\"?","options":["Che si aggiorna automaticamente ogni giorno","Che può funzionare direttamente da chiavetta USB, senza essere necessariamente installato","Che richiede una connessione internet permanente","Che mostra contenuti in diretta streaming"],"correct":"B","explain":"B) Che può funzionare direttamente da chiavetta USB, senza essere necessariamente installato."},{"n":244,"chapter":12,"chapter_title":"FeniceOS e il mondo Linux: uso consapevole","section":"Livello Base","type":"mc","stem":"A chi è pensato, in particolare, il progetto FeniceOS, secondo quanto descritto in questo manuale?","options":["Esclusivamente a informatici professionisti","A centri anziani, scuole e centri per il sociale, tra gli altri","Solo a chi possiede hardware nuovissimo","Solo a grandi aziende"],"correct":"B","explain":"B) A centri anziani, scuole e centri per il sociale, tra gli altri."},{"n":245,"chapter":12,"chapter_title":"FeniceOS e il mondo Linux: uso consapevole","section":"Livello Base","type":"vf","stem":"Vero o Falso: il nome \"FeniceOS\" richiama simbolicamente l'idea di far \"rinascere\" hardware che altrimenti sarebbe scartato.","options":[],"correct":"Vero","explain":"Vero — il nome richiama simbolicamente l'idea di far \"rinascere\" hardware altrimenti scartato."},{"n":246,"chapter":12,"chapter_title":"FeniceOS e il mondo Linux: uso consapevole","section":"Livello Base","type":"mc","stem":"Che cosa permette di fare, praticamente, avviare FeniceOS da una chiavetta USB su un computer esistente?","options":["Provare e usare il sistema operativo senza modificare necessariamente il disco del computer","Cancellare automaticamente tutti i dati del disco","Aumentare fisicamente la RAM","Cambiare il processore"],"correct":"A","explain":"A) Provare e usare il sistema operativo senza modificare necessariamente il disco del computer."},{"n":247,"chapter":12,"chapter_title":"FeniceOS e il mondo Linux: uso consapevole","section":"Livello Base","type":"vf","stem":"Vero o Falso: FeniceOS include, in linea con le distribuzioni Debian, strumenti di produttività e navigazione di base già pronti all'uso.","options":[],"correct":"Vero","explain":"Vero — FeniceOS include strumenti di produttività e navigazione di base già pronti."},{"n":248,"chapter":12,"chapter_title":"FeniceOS e il mondo Linux: uso consapevole","section":"Livello Base","type":"mc","stem":"Che cosa si intende, in generale, per software \"libero\" scelto come base per un progetto come FeniceOS?","options":["Software che garantisce libertà d'uso, studio, modifica e condivisione","Software sempre a pagamento","Software disponibile solo per una settimana","Software che richiede sempre una licenza commerciale"],"correct":"A","explain":"A) Software che garantisce libertà d'uso, studio, modifica e condivisione."},{"n":249,"chapter":12,"chapter_title":"FeniceOS e il mondo Linux: uso consapevole","section":"Livello Intermedio","type":"mc","stem":"FeniceOS è pensato per essere compatibile con quali due standard di avvio dei computer?","options":["DOS e Windows","BIOS e UEFI","Mac OS e iOS","Android e iOS"],"correct":"B","explain":"B) BIOS e UEFI."},{"n":250,"chapter":12,"chapter_title":"FeniceOS e il mondo Linux: uso consapevole","section":"Livello Intermedio","type":"vf","stem":"Vero o Falso: essendo basato su Debian, FeniceOS può beneficiare di un ampio ecosistema di pacchetti software mantenuti dalla comunità.","options":[],"correct":"Vero","explain":"Vero — essendo basato su Debian, FeniceOS beneficia dell'ampio ecosistema di pacchetti della comunità."},{"n":251,"chapter":12,"chapter_title":"FeniceOS e il mondo Linux: uso consapevole","section":"Livello Intermedio","type":"mc","stem":"Che cosa consente, su FeniceOS come su altre distribuzioni Debian, il sistema di gestione pacchetti APT?","options":["Installare, aggiornare e rimuovere programmi in modo centralizzato e sicuro","Cambiare il colore del desktop","Collegare automaticamente una stampante","Tradurre l'interfaccia"],"correct":"A","explain":"A) Installare, aggiornare e rimuovere programmi in modo centralizzato e sicuro."},{"n":252,"chapter":12,"chapter_title":"FeniceOS e il mondo Linux: uso consapevole","section":"Livello Intermedio","type":"mc","stem":"A cosa serve, per chi si occupa di un centro anziani o una scuola, avere un sistema operativo con requisiti hardware minimi contenuti, come FeniceOS?","options":["A poter riutilizzare hardware donato o datato invece di richiedere l'acquisto di macchine nuove","A vietare l'uso del computer","A garantire sempre la massima velocità possibile","A rendere obbligatorio l'acquisto di software aggiuntivo"],"correct":"A","explain":"A) A poter riutilizzare hardware donato o datato invece di richiedere l'acquisto di macchine nuove."},{"n":253,"chapter":12,"chapter_title":"FeniceOS e il mondo Linux: uso consapevole","section":"Livello Intermedio","type":"vf","stem":"Vero o Falso: usare FeniceOS da chiavetta USB, senza installarlo, rende comunque possibile navigare in internet, scrivere documenti e fare altre operazioni di base.","options":[],"correct":"Vero","explain":"Vero — anche da chiavetta, senza installazione, restano possibili le operazioni di base."},{"n":254,"chapter":12,"chapter_title":"FeniceOS e il mondo Linux: uso consapevole","section":"Livello Intermedio","type":"mc","stem":"Che cosa indica, in ambito Debian/FeniceOS, il fatto che il sistema sia sviluppato \"in modo comunitario e trasparente\"?","options":["Che lo sviluppo coinvolge una comunità di collaboratori, con processi e codice sorgente verificabili, invece di essere gestito da un'unica azienda chiusa","Che il sistema non ha alcun tipo di aggiornamento","Che il sistema è disponibile solo a pagamento","Che il sistema non può essere usato in ambito educativo"],"correct":"A","explain":"A) Che lo sviluppo coinvolge una comunità di collaboratori, con processi e codice verificabili."},{"n":255,"chapter":12,"chapter_title":"FeniceOS e il mondo Linux: uso consapevole","section":"Livello Intermedio","type":"vf","stem":"Vero o Falso: la scelta di Debian come base per FeniceOS è motivata, tra l'altro, dalla sua stabilità e dal supporto di lungo periodo tipico di questo progetto.","options":[],"correct":"Vero","explain":"Vero — stabilità e supporto di lungo periodo sono tra le ragioni della scelta di Debian."},{"n":256,"chapter":12,"chapter_title":"FeniceOS e il mondo Linux: uso consapevole","section":"Livello Intermedio","type":"mc","stem":"A cosa serve, in pratica, la possibilità di personalizzare l'ambiente grafico di FeniceOS?","options":["A adattare l'aspetto e la semplicità dell'interfaccia alle esigenze di chi lo utilizza, per esempio persone alle prime armi","A cambiare il processore installato","A modificare la RAM disponibile","A collegare automaticamente periferiche hardware"],"correct":"A","explain":"A) A adattare l'aspetto e la semplicità dell'interfaccia alle esigenze di chi lo utilizza."},{"n":257,"chapter":12,"chapter_title":"FeniceOS e il mondo Linux: uso consapevole","section":"Livello Esperto","type":"mc","stem":"Che cos'è \"debootstrap\", nel contesto della costruzione di sistemi basati su Debian come FeniceOS?","options":["Uno strumento che permette di creare da zero un sistema Debian minimo, utile come base per un'immagine live","Un tipo di virus","Un browser preinstallato","Un formato audio"],"correct":"A","explain":"A) Uno strumento che permette di creare da zero un sistema Debian minimo, base per un'immagine live."},{"n":258,"chapter":12,"chapter_title":"FeniceOS e il mondo Linux: uso consapevole","section":"Livello Esperto","type":"vf","stem":"Vero o Falso: l'ambiente \"chroot\", usato in fase di costruzione di un sistema come FeniceOS, permette d gruppo."}]}</script>
<script>(function(){
"use strict";

/* ------------------------------------------------------------------ data */
var DATA = JSON.parse(document.getElementById('quiz-data').textContent);
var QUESTIONS = DATA.questions;
var BY_ID = {};
QUESTIONS.forEach(function(q){ BY_ID[q.n] = q; });
var LEVELS = ["Livello Base","Livello Intermedio","Livello Esperto"];
var PART_COLOR = {1:'green',2:'orange',3:'blue',4:'purple'};

/* ------------------------------------------------------------- storage */
var STORE_KEY = 'feniceos_quiz_progress_v1';
var SETTINGS_KEY = 'feniceos_quiz_settings_v1';
var progress = {};   // { "37": {answered:true, correct:true, chosen:"B"} }
var settings = { fontStep: 0, contrast: 'normal' };

function loadStorage(){
  try{
    var p = localStorage.getItem(STORE_KEY);
    if(p) progress = JSON.parse(p);
  }catch(e){ progress = {}; }
  try{
    var s = localStorage.getItem(SETTINGS_KEY);
    if(s) settings = Object.assign(settings, JSON.parse(s));
  }catch(e){ /* ignore: localStorage may be unavailable (private mode, file://) */ }
}
function saveProgress(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }catch(e){}
}
function saveSettings(){
  try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(e){}
}

/* -------------------------------------------------------------- helpers */
function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs || {};
  for(var k in attrs){
    if(attrs[k] == null) continue; // salta null/undefined (es. disabled condizionale)
    if(k === 'class') e.className = attrs[k];
    else if(k === 'html') e.innerHTML = attrs[k];
    else if(k.indexOf('on') === 0 && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(function(c){
    if(c == null) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}
function questionsFor(chapterNum, level){
  return QUESTIONS.filter(function(q){ return q.chapter === chapterNum && q.section === level; })
                  .sort(function(a,b){ return a.n - b.n; });
}
function chapterScore(chapterNum, level){
  var qs = questionsFor(chapterNum, level);
  var answered = 0, correct = 0;
  qs.forEach(function(q){
    var st = progress[q.n];
    if(st && st.answered){ answered++; if(st.correct) correct++; }
  });
  return {total: qs.length, answered: answered, correct: correct};
}
function partScore(partNum){
  var chs = DATA.parts.filter(function(p){return p.num===partNum;})[0].chapters;
  var answered=0, correct=0, total=0;
  chs.forEach(function(ch){
    LEVELS.forEach(function(lv){
      var s = chapterScore(ch.num, lv);
      total += s.total; answered += s.answered; correct += s.correct;
    });
  });
  return {total:total, answered:answered, correct:correct};
}
function globalScore(){
  var answered=0, correct=0;
  QUESTIONS.forEach(function(q){
    var st = progress[q.n];
    if(st && st.answered){ answered++; if(st.correct) correct++; }
  });
  return {total: QUESTIONS.length, answered: answered, correct: correct};
}
function toast(msg){
  var t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._tm);
  toast._tm = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

/* ---------------------------------------------------------------- icons */
var ICONS = {
  home: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  check: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  cross: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  shuffle: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>'
};
function phoenixSVG(size){
  size = size || 64;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 120 120" aria-hidden="true">' +
    '<circle cx="60" cy="60" r="58" fill="#f7cd8a"/>' +
    '<g fill="none" stroke="#c9812f" stroke-width="4" stroke-linecap="round">' +
    '<path d="M60 40 L20 30 M60 40 L18 45 M60 40 L20 60 M60 40 L22 75 M60 40 L28 88"/>' +
    '<path d="M60 40 L100 30 M60 40 L102 45 M60 40 L100 60 M60 40 L98 75 M60 40 L92 88"/>' +
    '</g>' +
    '<path d="M60 34 C50 34 44 44 44 56 C44 72 52 84 60 96 C68 84 76 72 76 56 C76 44 70 34 60 34 Z" fill="#e8973c"/>' +
    '<path d="M60 30 L54 22 L60 18 L66 22 Z" fill="#e8973c"/>' +
    '<circle cx="57" cy="30" r="1.6" fill="#1b3a4b"/>' +
    '</svg>';
}

/* ---------------------------------------------------------------- views */
var main = $('#main');
var state = { view:'home', chapter:null, level:null, list:[], idx:0, mode:'level', sessionScore:0 };

function render(){
  window.scrollTo(0,0);
  main.innerHTML = '';
  main.className = 'view';
  if(state.view === 'home') renderHome();
  else if(state.view === 'quiz') renderQuiz();
  else if(state.view === 'results') renderResults();
  updateA11yButtons();
}

function renderHome(){
  var g = globalScore();
  var hero = el('div',{class:'hero'},[
    (function(){ var d=document.createElement('div'); d.innerHTML=phoenixSVG(84); return d.firstChild; })(),
    el('h1',{},[ 'Il Grande Quiz ', el('span',{class:'accent',html:"dell'Informatica"}) ]),
    el('p',{}, [DATA.subtitle]),
    el('div',{class:'stats'},[
      el('div',{class:'stat-pill'}, [g.answered+"/"+g.total, el('span',{},[' risposte date'])]),
      el('div',{class:'stat-pill'}, [ (g.answered? Math.round(100*g.correct/g.answered):0)+"%", el('span',{},[' corrette finora'])])
    ])
  ]);
  main.appendChild(hero);

  var modeRow = el('div',{class:'mode-row'},[
    el('button',{class:'bigbtn', html: ICONS.shuffle+' Allenamento casuale (20 domande da tutto il libro)', onclick:startRandomQuiz}),
    el('button',{class:'bigbtn ghost ' + ( (g.answered>0) ? '' : 'hidden'), onclick:confirmReset}, ['Azzera i progressi salvati'])
  ]);
  main.appendChild(modeRow);

  DATA.parts.forEach(function(part){
    var color = PART_COLOR[part.num];
    var ps = partScore(part.num);
    var block = el('div',{class:'part-block'});
    var head = el('div',{class:'part-head', style:'background:var(--'+color+')'},[
      el('div',{class:'roman'},[part.roman]),
      el('div',{},[
        el('h2',{},[part.title]),
        el('p',{},[part.desc])
      ]),
      el('div',{class:'part-progress'},[
        el('b',{},[ps.answered+'/'+ps.total]),
        'risposte'
      ])
    ]);
    block.appendChild(head);
    part.chapters.forEach(function(ch){
      var row = el('div',{class:'chapter-row'});
      row.appendChild(el('h3',{},['Capitolo '+ch.num+' — '+ch.title]));
      var lrow = el('div',{class:'level-row'});
      LEVELS.forEach(function(lv){
        var s = chapterScore(ch.num, lv);
        var cls = 'level-btn';
        var scoreTxt = s.total+' domande';
        if(s.answered>0){
          scoreTxt = s.correct+'/'+s.answered+' corrette ('+s.answered+'/'+s.total+' fatte)';
          cls += (s.answered>=s.total) ? ' done' : ' inprogress';
        }
        lrow.appendChild(el('button',{class:cls, onclick:(function(chn,lvv){ return function(){ startChapterQuiz(chn,lvv); }; })(ch.num, lv)},[
          el('span',{class:'lname'},[lv.replace('Livello ','')]),
          el('span',{class:'lscore'},[scoreTxt])
        ]));
      });
      row.appendChild(lrow);
      block.appendChild(row);
    });
    main.appendChild(block);
  });

  main.appendChild(el('footer',{},[
    "Il Grande Quiz dell'Informatica — un progetto FeniceOS di " + DATA.author + ". Versione interattiva offline, nessuna connessione richiesta."
  ]));
}

function startChapterQuiz(chapterNum, level){
  var list = questionsFor(chapterNum, level);
  state.view='quiz'; state.mode='level'; state.chapter=chapterNum; state.level=level;
  state.list = list.map(function(q){return q.n;}); state.idx = 0; state.sessionScore = 0;
  render();
}
function startRandomQuiz(){
  var pool = QUESTIONS.map(function(q){return q.n;});
  for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
  state.view='quiz'; state.mode='random'; state.chapter=null; state.level=null;
  state.list = pool.slice(0,20); state.idx=0; state.sessionScore=0;
  render();
}
function confirmReset(){
  if(window.confirm('Vuoi davvero cancellare tutti i progressi e i punteggi salvati su questo dispositivo?')){
    progress = {}; saveProgress(); toast('Progressi azzerati.'); render();
  }
}

function renderQuiz(){
  var qn = state.list[state.idx];
  var q = BY_ID[qn];
  var chTitle = state.mode==='random' ? 'Allenamento casuale' : ('Capitolo '+q.chapter+' — '+q.chapter_title);
  var sub = state.mode==='random' ? ('Domanda casuale D'+q.n) : (q.section);

  var header = el('div',{id:'quizHeader'},[
    el('button',{class:'backbtn', onclick:function(){ state.view='home'; render(); }},['← Indice']),
    el('div',{class:'qtitle'},[chTitle, el('small',{},[sub])]),
    el('div',{id:'scoreLive'},[ 'Punteggio sessione: '+state.sessionScore+'/'+state.idx ])
  ]);
  main.appendChild(header);

  var pct = Math.round(100*state.idx/state.list.length);
  main.appendChild(el('div',{class:'progressbar'},[ el('div',{style:'width:'+pct+'%'}) ]));

  var card = el('div',{class:'qcard'});
  card.appendChild(el('div',{class:'qnum-badge'},['D'+q.n]));
  if(q.type==='open') card.appendChild(el('span',{class:'qtag'},['domanda aperta']));
  card.appendChild(el('div',{class:'qstem', html:q.stem}));

  var st = progress[q.n];
  var answered = !!(st && st.answered);

  if(q.type === 'mc'){
    var opts = el('div',{class:'opts'});
    var letters = ['A','B','C','D'];
    letters.forEach(function(L, i){
      var btn = el('button',{class:'optbtn', disabled: answered ? 'disabled': null},[
        el('span',{class:'optlet'},[L+')']),
        el('span',{html:q.options[i]})
      ]);
      if(answered){
        if(L === q.correct) btn.classList.add('correct');
        else if(st.chosen === L) btn.classList.add('wrong');
        else btn.classList.add('dim');
      }
      btn.addEventListener('click', function(){ answerQuestion(q, L); });
      opts.appendChild(btn);
    });
    card.appendChild(opts);
  } else if(q.type === 'vf'){
    var row = el('div',{class:'vfrow'});
    ['Vero','Falso'].forEach(function(L){
      var btn = el('button',{class:'optbtn', disabled: answered ? 'disabled': null},[L]);
      if(answered){
        if(L === q.correct) btn.classList.add('correct');
        else if(st.chosen === L) btn.classList.add('wrong');
        else btn.classList.add('dim');
      }
      btn.addEventListener('click', function(LL){ return function(){ answerQuestion(q, LL); }; }(L));
      row.appendChild(btn);
    });
    card.appendChild(row);
  } else if(!answered){
    // domanda aperta: nessuna scelta multipla, si mostra direttamente lo spunto di risposta
    var showBtn = el('button',{class:'bigbtn secondary', style:'margin-top:.4rem;'},['Mostra la traccia di risposta']);
    showBtn.addEventListener('click', function(){ answerQuestion(q, 'OPEN'); });
    card.appendChild(showBtn);
  }

  if(answered){
    var isCorrect = st.correct;
    var fb = el('div',{class:'feedback '+(isCorrect?'ok':'bad')},[
      el('div',{class:'ficon', html: isCorrect?ICONS.check:ICONS.cross}),
      el('div',{},[
        el('b',{},[isCorrect ? 'Esatto!' : (q.type==='open' ? 'Traccia di risposta' : 'Non esatto')]),
        el('div',{html:q.explain})
      ])
    ]);
    card.appendChild(fb);
  }

  main.appendChild(card);

  var actions = el('div',{class:'qactions'},[
    el('button',{class:'navbtn prev', disabled: state.idx===0?'disabled':null, onclick:function(){ state.idx--; render(); }},['← Precedente']),
    el('button',{class:'navbtn', disabled: answered? null : 'disabled', onclick:nextQuestion},[
      state.idx === state.list.length-1 ? 'Vedi risultati →' : 'Prossima domanda →'
    ])
  ]);
  main.appendChild(actions);
}
function answerQuestion(q, chosen){
  var correct;
  if(q.type === 'open') correct = true;
  else correct = (chosen === q.correct);
  var already = progress[q.n] && progress[q.n].answered;
  progress[q.n] = {answered:true, correct:correct, chosen:chosen};
  saveProgress();
  if(!already && correct) state.sessionScore++;
  render();
}
function nextQuestion(){
  if(state.idx < state.list.length-1){ state.idx++; render(); }
  else { state.view='results'; render(); }
}

function renderResults(){
  var total = state.list.length;
  var correct = 0;
  var wrongList = [];
  state.list.forEach(function(qn){
    var st = progress[qn];
    if(st && st.correct) correct++;
    else wrongList.push(qn);
  });
  var pct = total? Math.round(100*correct/total) : 0;
  var title = state.mode==='random' ? 'Allenamento casuale completato' :
              ('Capitolo '+state.chapter+' — '+state.level+' completato');

  main.appendChild(el('div',{class:'results-hero'},[
    el('h1',{},[title]),
    el('div',{class:'score-circle'},[
      el('b',{},[correct+'/'+total]),
      el('span',{},[pct+'% corrette'])
    ]),
    el('p',{},[ pct>=80 ? 'Ottimo lavoro! Padronanza solida su questo argomento.' :
                 pct>=50 ? 'Buon punteggio: ripassando i punti mancati migliorerai ancora.' :
                 'Continua a esercitarti: ogni domanda ripassata è un passo avanti.' ])
  ]));

  var actions = el('div',{class:'mode-row'});
  var homeBtn = el('button',{class:'bigbtn'},[]); homeBtn.innerHTML = ICONS.home+' Torna all’indice'; homeBtn.addEventListener('click', function(){ state.view='home'; render(); });
  actions.appendChild(homeBtn);
  if(state.mode==='level'){
    var retryBtn = el('button',{class:'bigbtn secondary'},['Rifai questo livello']);
    retryBtn.addEventListener('click', function(){ startChapterQuiz(state.chapter, state.level); });
    actions.appendChild(retryBtn);
  }
  if(wrongList.length){
    var reviewBtn = el('button',{class:'bigbtn ghost'},['Rivedi solo le '+wrongList.length+' domande sbagliate']);
    reviewBtn.addEventListener('click', function(){
      state.list = wrongList; state.idx = 0; state.view='quiz'; render();
    });
    actions.appendChild(reviewBtn);
  }
  main.appendChild(actions);

  if(wrongList.length){
    var reviewWrap = el('div',{},[ el('h2',{style:'margin:1.6rem 0 .8rem 0; font-size:1.1rem;'},['Domande da ripassare']) ]);
    wrongList.forEach(function(qn){
      var q = BY_ID[qn];
      reviewWrap.appendChild(el('div',{class:'review-item wrong'},[
        el('div',{class:'rq'},['D'+q.n+'. '+stripTags(q.stem)]),
        el('div',{class:'ra', html:q.explain})
      ]));
    });
    main.appendChild(reviewWrap);
  }
}
function stripTags(html){
  var d = document.createElement('div'); d.innerHTML = html; return d.textContent || d.innerText || '';
}

/* ----------------------------------------------------------- a11y bar */
function applyFontScale(){
  var base = 19 + settings.fontStep * 2;
  base = Math.max(15, Math.min(31, base));
  document.documentElement.style.setProperty('--fs', base+'px');
}
function applyContrast(){
  document.documentElement.setAttribute('data-contrast', settings.contrast);
}
function updateA11yButtons(){
  var hc = $('#btnContrast');
  if(hc) hc.setAttribute('aria-pressed', settings.contrast==='high' ? 'true':'false');
}
function initA11y(){
  $('#btnFontMinus').addEventListener('click', function(){ settings.fontStep = Math.max(-2, settings.fontStep-1); applyFontScale(); saveSettings(); });
  $('#btnFontPlus').addEventListener('click', function(){ settings.fontStep = Math.min(6, settings.fontStep+1); applyFontScale(); saveSettings(); });
  $('#btnContrast').addEventListener('click', function(){ settings.contrast = settings.contrast==='high' ? 'normal':'high'; applyContrast(); saveSettings(); updateA11yButtons(); });
  $('#brandHome').addEventListener('click', function(){ state.view='home'; render(); });
  applyFontScale(); applyContrast();
}

/* --------------------------------------------------------------- init */
function init(){
  loadStorage();
  initA11y();
  render();
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
</body>
</html>
